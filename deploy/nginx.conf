# Konfigurasi Nginx — reverse proxy ke server FastAPI (Docker, port 8000)
# Ganti absensi.smkxxx.sch.id dengan domain/subdomain sekolah yang sebenarnya.
#
# Setup HTTPS (Let's Encrypt) setelah file ini aktif:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d absensi.smkxxx.sch.id
# certbot akan otomatis menambahkan blok server 443 + redirect di file ini.

server {
    listen 80;
    server_name absensi.smkxxx.sch.id;

    client_max_body_size 20M;  # cukup untuk upload foto batch enrollment

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # sync bisa berisi batch besar setelah device lama offline — beri
        # waktu lebih longgar daripada default
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
