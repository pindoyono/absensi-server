# Konfigurasi Nginx — reverse proxy ke server FastAPI (Docker, port 8000)
# Ganti absensi.smkxxx.sch.id dengan domain/subdomain sekolah yang sebenarnya.
#
# Setup HTTPS (Let's Encrypt) setelah file ini aktif:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d absensi.smkxxx.sch.id
# certbot akan otomatis menambahkan blok server 443 + redirect di file ini.

server {
    listen 80;
    server_name front.smkn2malinau.sch.id;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name absen.smkn2malinau.sch.id;

    ssl_certificate /etc/letsencrypt/live/absen.smkn2malinau.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/absen.smkn2malinau.sch.id/privkey.pem;

    client_max_body_size 20M;

    location / {
        add_header 'Access-Control-Allow-Origin' 'https://front.smkn2malinau.sch.id' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://front.smkn2malinau.sch.id' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
